<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4d6bfe">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DeepSeek 助手</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7; color: #1f2329;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: #4d6bfe; color: #fff; font-weight: 600; font-size: 17px;
  }
  #gear {
    background: transparent; border: none; color: #fff;
    font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 8px;
  }
  #gear:active { background: rgba(255,255,255,.25); }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word; font-size: 15px;
  }
  .user { align-self: flex-end; background: #4d6bfe; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .bot.loading { color: #999; font-style: italic; }
  form {
    display: flex; gap: 8px; padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid #eee;
  }
  #input {
    flex: 1; padding: 12px 14px; border: 1px solid #ddd; border-radius: 22px;
    font-size: 16px; outline: none; min-width: 0;
  }
  #input:focus { border-color: #4d6bfe; }
  #send {
    border: none; background: #4d6bfe; color: #fff; padding: 0 20px;
    border-radius: 22px; font-size: 16px; cursor: pointer;
  }
  #send:disabled { background: #b9c4f5; }
  .hidden { display: none !important; }

  /* 设置 / 密钥弹层 */
  #overlay {
    position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card { background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 430px; }
  .card h3 { margin: 0 0 10px; font-size: 18px; }
  .card p { color: #666; font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
  .card input {
    width: 100%; padding: 12px 14px; border: 1px solid #ccc;
    border-radius: 10px; font-size: 15px; margin-bottom: 14px; outline: none;
  }
  .card input:focus { border-color: #4d6bfe; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
  #saveKey { background: #4d6bfe; color: #fff; }
  .ghost { background: #eef0f4; color: #333; }
  .err { color: #d1242f; font-size: 13px; min-height: 18px; margin: 8px 0 0; }
  .tip { font-size: 12px; color: #999; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <header>
    <span>DeepSeek 助手</span>
    <button id="gear" title="设置">⚙</button>
  </header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="输入消息…" autocomplete="off" enterkeyhint="send">
    <button id="send" type="submit">发送</button>
  </form>

  <!-- 密钥设置弹层 -->
  <div id="overlay" class="hidden">
    <div class="card">
      <h3>设置 API Key</h3>
      <p>首次使用，请粘贴你的 DeepSeek API Key（sk- 开头）。它只保存在这台设备的浏览器里，不会上传到任何服务器。</p>
      <input id="keyInput" type="password" placeholder="sk-xxxxxxxxxxxxxxxx">
      <div class="row">
        <button id="saveKey">保存</button>
        <button id="cancelKey" class="ghost">取消</button>
      </div>
      <button id="clearHist" class="ghost" style="width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;font-size:15px;cursor:pointer;background:#fff3f3;color:#d1242f;">清空聊天记录</button>
      <p class="err" id="keyMsg"></p>
      <p class="tip">提示：密钥可在 <b>platform.deepseek.com/api_keys</b> 创建。若在分享的网络或公共设备上使用，用完记得清空。</p>
    </div>
  </div>

<script>
  const API_URL = 'https://api.deepseek.com/chat/completions';
  const MODEL = 'deepseek-flash';           // 也可换成 'deepseek-v4-pro'
  const SYSTEM_PROMPT = '你是一个友好、简洁、准确的中文助手。';

  const chatEl   = document.getElementById('chat');
  const form     = document.getElementById('form');
  const input    = document.getElementById('input');
  const sendBtn  = document.getElementById('send');
  const overlay  = document.getElementById('overlay');
  const keyInput = document.getElementById('keyInput');
  const keyMsg   = document.getElementById('keyMsg');
  const cancelBtn= document.getElementById('cancelKey');

  let messages = [];
  let isSending = false;

  const getKey = () => localStorage.getItem('ds_key') || '';
  const setKey = (k) => localStorage.setItem('ds_key', k);

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function renderHistory() {
    chatEl.innerHTML = '';
    messages.forEach(m => {
      if (m.role === 'user') addMsg('user', m.content);
      else if (m.role === 'assistant') addMsg('bot', m.content);
    });
  }

  function loadHistory() {
    try { messages = JSON.parse(localStorage.getItem('ds_history') || '[]'); } catch { messages = []; }
    if (!Array.isArray(messages) || !messages.length) messages = [{ role: 'system', content: SYSTEM_PROMPT }];
    renderHistory();
  }

  function saveHistory() {
    const sys = (messages[0] && messages[0].role === 'system') ? messages[0] : { role: 'system', content: SYSTEM_PROMPT };
    const rest = messages.filter(m => m.role !== 'system').slice(-40);
    messages = [sys, ...rest];
    localStorage.setItem('ds_history', JSON.stringify(messages));
  }

  function openKey() {
    keyInput.value = '';
    keyMsg.textContent = '';
    cancelBtn.classList.toggle('hidden', !getKey());   // 没密钥时不给“取消”
    overlay.classList.remove('hidden');
    setTimeout(() => keyInput.focus(), 50);
  }
  function closeKey() { overlay.classList.add('hidden'); }

  document.getElementById('saveKey').onclick = () => {
    const k = keyInput.value.trim();
    if (!k.startsWith('sk-') || k.length < 20) { keyMsg.textContent = '请填写正确的、以 sk- 开头的 API Key'; return; }
    setKey(k);
    closeKey();
    addMsg('bot', '✅ 密钥已保存，现在可以开始聊天了。');
  };
  cancelBtn.onclick = closeKey;
  document.getElementById('gear').onclick = openKey;
  document.getElementById('clearHist').onclick = () => {
    localStorage.removeItem('ds_history');
    messages = [{ role: 'system', content: SYSTEM_PROMPT }];
    renderHistory();
    closeKey();
    addMsg('bot', '🧹 聊天记录已清空。');
  };

  function mapError(status, detail) {
    if (status === 401) return '401 密钥无效或已失效，点右上角 ⚙ 重新填写';
    if (status === 402) return '402 账户余额不足，请到 DeepSeek 平台充值';
    if (status === 429) return '429 请求太频繁，稍等一下再试';
    if (status === 503) return '503 服务器繁忙，请稍后再试';
    return status + '：' + (detail || '未知错误');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isSending) return;
    const q = input.value.trim();
    if (!q) return;
    if (!getKey()) { openKey(); return; }

    input.value = '';
    addMsg('user', q);
    messages.push({ role: 'user', content: q });

    const loading = addMsg('bot', '正在思考…');
    loading.classList.add('loading');
    isSending = true;
    sendBtn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + getKey()
        },
        body: JSON.stringify({ model: MODEL, messages, stream: false })
      });

      if (!res.ok) {
        let detail = '';
        try { const j = await res.json(); detail = (j.error && j.error.message) ? j.error.message : JSON.stringify(j); } catch {}
        throw new Error(mapError(res.status, detail));
      }

      const data = await res.json();
      const reply = (data.choices && data.choices[0] && data.choices[0].message)
        ? data.choices[0].message.content
        : '（没有返回内容）';

      loading.remove();
      addMsg('bot', reply);
      messages.push({ role: 'assistant', content: reply });
      saveHistory();
    } catch (err) {
      loading.textContent = '出错了：' + err.message;
      loading.classList.remove('loading');
    } finally {
      isSending = false;
      sendBtn.disabled = false;
    }
  });

  loadHistory();
  if (!getKey()) openKey();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
